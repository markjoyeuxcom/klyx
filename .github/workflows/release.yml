name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0 or v0.2.0"
        required: true
        type: string
      publish_release:
        description: "Create or update the matching GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# One release run per ref. Never cancel an in-flight release - a half-published
# set of assets is worse than waiting for the previous run to finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  WAILS_VERSION: "v3.0.0-alpha2.103"

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish_release: ${{ steps.version.outputs.publish_release }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ inputs.version }}"
            publish="${{ inputs.publish_release }}"
          else
            raw="${GITHUB_REF_NAME}"
            publish="true"
          fi

          version="${raw#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be stable SemVer, for example 0.2.0 or v0.2.0" >&2
            exit 2
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "publish_release=${publish}" >> "${GITHUB_OUTPUT}"

  test:
    name: test
    runs-on: ubuntu-24.04
    needs: version
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/klyx/frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: |
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install frontend dependencies
        working-directory: cmd/klyx/frontend
        run: npm ci

      - name: Generate Wails bindings
        working-directory: cmd/klyx
        run: wails3 generate bindings -clean=true -ts

      - name: Test frontend
        working-directory: cmd/klyx/frontend
        run: npm test -- --run

      - name: Build frontend for Go embed
        working-directory: cmd/klyx/frontend
        run: npm run build

      - name: Test Go
        # Match ci.yml exactly: race-enabled, excluding the generated
        # cmd/klyx/build/ tree. A release must not pass on a weaker suite than
        # every PR already runs.
        run: go test -race $(go list ./... | grep -v '/cmd/klyx/build/')

  build-macos:
    name: build macOS universal
    runs-on: macos-latest
    needs: [version, test]
    env:
      KLYX_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/klyx/frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install frontend dependencies
        working-directory: cmd/klyx/frontend
        run: npm ci

      - name: Apply build version
        run: node scripts/set-build-version.mjs "${KLYX_VERSION}"

      - name: Build unsigned macOS app bundle
        working-directory: cmd/klyx
        run: |
          set -euo pipefail
          wails3 task darwin:build:universal
          mkdir -p bin/klyx.app/Contents/MacOS
          mkdir -p bin/klyx.app/Contents/Resources
          cp build/darwin/icons.icns bin/klyx.app/Contents/Resources
          if [[ -f build/darwin/Assets.car ]]; then
            cp build/darwin/Assets.car bin/klyx.app/Contents/Resources
          fi
          cp bin/klyx bin/klyx.app/Contents/MacOS/klyx
          cp build/darwin/Info.plist bin/klyx.app/Contents/Info.plist

      # Code-signing + notarization. INERT until the owner adds the Apple secrets:
      # the preflight sees empty env, the gate is false, the sign step skips, and
      # the app ships unsigned exactly as today. UNTESTED until first enabled.
      # Repo/org secrets required:
      #   APPLE_DEVELOPER_ID_APP_CERT_P12 - base64 of the Developer ID Application .p12
      #   APPLE_CERT_PASSWORD             - the .p12 export password
      #   APPLE_SIGNING_IDENTITY          - "Developer ID Application: NAME (TEAMID)"
      #   APPLE_NOTARY_KEY_P8             - base64 of the App Store Connect API .p8 key
      #   APPLE_NOTARY_KEY_ID             - the API key id
      #   APPLE_NOTARY_ISSUER_ID          - the App Store Connect issuer id
      - name: Signing preflight (macOS)
        id: macsign
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_P12 }}
        run: |
          if [[ -n "${CERT}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "No Apple signing secrets set - shipping the macOS app UNSIGNED."
          fi

      - name: Sign and notarize macOS app
        if: steps.macsign.outputs.enabled == 'true'
        working-directory: cmd/klyx
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/klyx-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "${CERT}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" -P "${CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain
          # Hardened runtime is required for notarization.
          codesign --force --deep --options runtime --timestamp \
            --sign "${SIGNING_IDENTITY}" bin/klyx.app
          codesign --verify --strict --verbose=2 bin/klyx.app
          echo "${NOTARY_KEY_P8}" | base64 --decode > "${RUNNER_TEMP}/notary.p8"
          ditto -c -k --keepParent bin/klyx.app "${RUNNER_TEMP}/notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" \
            --key "${RUNNER_TEMP}/notary.p8" \
            --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" \
            --wait
          xcrun stapler staple bin/klyx.app
          rm -f "${RUNNER_TEMP}/cert.p12" "${RUNNER_TEMP}/notary.p8"

      - name: Package macOS artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            cmd/klyx/bin/klyx.app \
            "artifacts/klyx-${KLYX_VERSION}-darwin-universal.zip"
          # Record leaf names only, so 'shasum -c' works from inside the
          # download dir (running over artifacts/* bakes the path prefix in).
          (cd artifacts && shasum -a 256 "klyx-${KLYX_VERSION}-darwin-universal.zip" \
            > "klyx-${KLYX_VERSION}-darwin-universal.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: klyx-${{ env.KLYX_VERSION }}-darwin-universal
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  build-linux:
    name: build Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      KLYX_VERSION: ${{ needs.version.outputs.version }}
      KLYX_ARCH: ${{ matrix.arch }}
      GOARCH: ${{ matrix.arch }}
      GIT_COMMITTER_NAME: Moomora
      GIT_COMMITTER_EMAIL: actions@github.com
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/klyx/frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            rpm \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: |
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install frontend dependencies
        working-directory: cmd/klyx/frontend
        run: npm ci

      - name: Apply build version
        run: node scripts/set-build-version.mjs "${KLYX_VERSION}"

      # The runner is amd64, so arm64 is a cross-arch build: the linux:build
      # task routes to Docker (Dockerfile.cross) when target != host arch, and
      # that path needs the wails-cross image built first. amd64 builds
      # natively and never touches Docker.
      - name: Build cross-compile image (arm64 only)
        if: matrix.arch == 'arm64'
        working-directory: cmd/klyx
        run: wails3 task setup:docker

      - name: Build Linux binary and packages
        working-directory: cmd/klyx
        run: |
          set -euo pipefail
          wails3 task linux:build ARCH="${KLYX_ARCH}" OUTPUT=bin/klyx
          wails3 task linux:generate:dotdesktop
          wails3 task linux:generate:deb
          wails3 task linux:generate:rpm

      - name: Package Linux artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux/klyx
          install -m 0755 cmd/klyx/bin/klyx artifacts/linux/klyx/klyx
          install -m 0644 cmd/klyx/build/linux/klyx.desktop artifacts/linux/klyx/klyx.desktop
          install -m 0644 cmd/klyx/build/appicon.png artifacts/linux/klyx/klyx.png
          tar -C artifacts/linux -czf "artifacts/klyx-${KLYX_VERSION}-linux-${KLYX_ARCH}.tar.gz" klyx
          cp cmd/klyx/bin/*.deb "artifacts/klyx-${KLYX_VERSION}-linux-${KLYX_ARCH}.deb"
          cp cmd/klyx/bin/*.rpm "artifacts/klyx-${KLYX_VERSION}-linux-${KLYX_ARCH}.rpm"
          rm -rf artifacts/linux
          # Record leaf names only, so 'sha256sum -c' works from inside the
          # download dir (running over artifacts/* bakes the path prefix in).
          (cd artifacts && sha256sum \
            "klyx-${KLYX_VERSION}-linux-${KLYX_ARCH}.tar.gz" \
            "klyx-${KLYX_VERSION}-linux-${KLYX_ARCH}.deb" \
            "klyx-${KLYX_VERSION}-linux-${KLYX_ARCH}.rpm" \
            > "klyx-${KLYX_VERSION}-linux-${KLYX_ARCH}.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: klyx-${{ env.KLYX_VERSION }}-linux-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  build-windows:
    name: build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      KLYX_VERSION: ${{ needs.version.outputs.version }}
      KLYX_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/klyx/frontend/package-lock.json

      - name: Install NSIS
        shell: pwsh
        run: |
          # Chocolatey's community feed 503s often enough to have killed a
          # release (v0.5.1, 2026-07-04): retry with backoff, then fall back
          # to the pinned SourceForge installer. The makensis search below
          # handles either install location.
          $installed = $false
          foreach ($attempt in 1..3) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            Write-Host "choco attempt $attempt failed; backing off"
            Start-Sleep -Seconds (20 * $attempt)
          }
          if (-not $installed) {
            Write-Host "chocolatey unavailable - falling back to the pinned NSIS installer"
            $exe = Join-Path $env:RUNNER_TEMP "nsis-setup.exe"
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe" -OutFile $exe -MaximumRetryCount 3 -RetryIntervalSec 10
            Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          }

          $searchRoots = @(
            ${env:ProgramFiles(x86)},
            $env:ProgramFiles,
            "C:\tools"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $nsisPath = $searchRoots |
            ForEach-Object {
              Get-ChildItem -Path $_ -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue
            } |
            Select-Object -First 1 -ExpandProperty DirectoryName

          if (-not $nsisPath) {
            throw "makensis.exe was not found after installing NSIS"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $nsisPath
          & (Join-Path $nsisPath "makensis.exe") /VERSION

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $goBin = "$(go env GOPATH)\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $goBin
          go install github.com/wailsapp/wails/v3/cmd/wails3@${env:WAILS_VERSION}

      - name: Install frontend dependencies
        working-directory: cmd/klyx/frontend
        run: npm ci

      - name: Apply build version
        run: node scripts/set-build-version.mjs "${env:KLYX_VERSION}"
        shell: pwsh

      - name: Build Windows executable and installer
        working-directory: cmd/klyx
        shell: pwsh
        run: |
          wails3 task windows:create:nsis:installer ARCH=${env:KLYX_ARCH} INSTALL_SCOPE=user

      # Authenticode signing. INERT until the owner adds the Windows secrets;
      # skips (unsigned, as today) when absent. UNTESTED until first enabled.
      # NOTE: since 2023, new public OV/EV certs are issued only on hardware
      # tokens, so a PFX-in-CI works only for an existing/internal cert - a fresh
      # cert likely needs cloud signing (Azure Trusted Signing / DigiCert
      # KeyLocker / SSL.com eSigner), which would replace this step's secrets.
      # Requires: WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD,
      #           WINDOWS_TIMESTAMP_URL (optional; defaults to DigiCert).
      - name: Signing preflight (Windows)
        id: winsign
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          if ($env:PFX) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No Windows signing secrets set - shipping UNSIGNED."
          }

      - name: Sign Windows binaries
        if: steps.winsign.outputs.enabled == 'true'
        shell: pwsh
        working-directory: cmd/klyx
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "klyx-cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX))
          $ts = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          foreach ($f in @("bin/klyx.exe", "bin/klyx-$($env:KLYX_ARCH)-installer.exe")) {
            & $signtool sign /f $pfxPath /p $env:PFX_PASSWORD /fd SHA256 /tr $ts /td SHA256 $f
          }
          Remove-Item $pfxPath

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item cmd/klyx/bin/klyx.exe "artifacts/klyx-${env:KLYX_VERSION}-windows-${env:KLYX_ARCH}.exe"
          Copy-Item "cmd/klyx/bin/klyx-${env:KLYX_ARCH}-installer.exe" "artifacts/klyx-${env:KLYX_VERSION}-windows-${env:KLYX_ARCH}-installer.exe"
          Compress-Archive -Path "artifacts/klyx-${env:KLYX_VERSION}-windows-${env:KLYX_ARCH}.exe" -DestinationPath "artifacts/klyx-${env:KLYX_VERSION}-windows-${env:KLYX_ARCH}.zip"
          Remove-Item "artifacts/klyx-${env:KLYX_VERSION}-windows-${env:KLYX_ARCH}.exe"
          Get-ChildItem artifacts | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Set-Content "artifacts/klyx-${env:KLYX_VERSION}-windows-${env:KLYX_ARCH}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: klyx-${{ env.KLYX_VERSION }}-windows-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [version, build-macos, build-linux, build-windows]
    if: needs.version.outputs.publish_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: klyx-${{ needs.version.outputs.version }}-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -lah release-artifacts
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-artifacts/* --clobber
          else
            gh release create "${TAG}" release-artifacts/* \
              --target "${GITHUB_SHA}" \
              --title "Klyx ${TAG}" \
              --notes "Klyx desktop builds for ${TAG}. Verify each asset against its .sha256."
          fi
