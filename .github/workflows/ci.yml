name: ci

# Tests on every push and PR - not just at release time. The release workflow
# runs the same suites, but a failing test must surface when it lands, not
# weeks later when a tag is cut.
#
# Two gitignored artifacts need recreating on a fresh checkout:
#   - cmd/klyx/frontend/dist  (the //go:embed target; stubbed for vet/test)
#   - cmd/klyx/frontend/bindings (wails3-generated TS; needed by tsc/vitest)
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  WAILS_VERSION: "v3.0.0-alpha2.103"
  GOLANGCI_VERSION: "v2.14.0"
  GOVULNCHECK_VERSION: "v1.8.0"

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # internal/ and cmd/klyxctl/ do not import the Wails runtime, so this job
      # needs no GTK/WebKit headers or frontend/dist stub (unlike the go job).
      # cmd/klyx (the Wails main) is covered by go vet in the `go` job; config
      # lives in .golangci.yml (high-signal set; ST*/QF* style checks off).
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}
          "$(go env GOPATH)/bin/golangci-lint" run ./internal/... ./cmd/klyxctl/... --timeout=5m

      # Reachable-vulnerability gate on the toolchain go.mod selects (the same
      # one release.yml builds with) and the module graph. Same scope as the
      # lint: cmd/klyx needs GTK to type-check. Fails on any CALLED advisory;
      # advisories in modules whose vulnerable symbols are never reached are
      # reported but do not fail.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./internal/... ./cmd/klyxctl/...

  go:
    name: go vet + test (-race)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # cmd/klyx imports Wails, which needs the GTK/WebKit headers to compile
      # on Linux (same dependency set the release workflow installs).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      # The //go:embed all:frontend/dist pattern needs at least one file. Vet
      # and tests never serve assets, so a stub keeps this job node-free.
      - name: Stub frontend dist for the Go embed
        run: |
          mkdir -p cmd/klyx/frontend/dist
          touch cmd/klyx/frontend/dist/.ci-stub

      - name: go vet
        run: go vet $(go list ./... | grep -v '/cmd/klyx/build/')

      - name: go test -race
        run: go test -race $(go list ./... | grep -v '/cmd/klyx/build/')

      - name: gofmt
        run: |
          out="$(gofmt -l internal/ cmd/klyx/main.go cmd/klyxctl/)"
          if [ -n "${out}" ]; then
            echo "gofmt needed on:" >&2
            echo "${out}" >&2
            exit 1
          fi

  frontend:
    name: tsc + vitest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/klyx/frontend/package-lock.json

      # Binding generation loads the Go packages, which import the Wails
      # runtime - the GTK/WebKit headers are needed even here.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: |
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install frontend dependencies
        working-directory: cmd/klyx/frontend
        run: npm ci

      - name: Generate Wails bindings
        working-directory: cmd/klyx
        run: wails3 generate bindings -clean=true -ts

      - name: Typecheck
        working-directory: cmd/klyx/frontend
        run: npx tsc --noEmit

      # eslint.config.js is a high-signal set (classic react-hooks rules; the
      # React-Compiler-presumptive rules are off). Warnings (exhaustive-deps) are
      # advisory; the step fails only on errors.
      - name: Lint frontend
        working-directory: cmd/klyx/frontend
        run: npm run lint

      - name: Tests
        working-directory: cmd/klyx/frontend
        run: npm test -- --run

      # tsc/vitest run against the dev toolchain; a prod-only vite breakage
      # (env-gated imports, build-time transforms) would slip through to a tag
      # otherwise. Run the real production build per-PR to catch it here.
      - name: Build frontend (production)
        working-directory: cmd/klyx/frontend
        run: npm run build
