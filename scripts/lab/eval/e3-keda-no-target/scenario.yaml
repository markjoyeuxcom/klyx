# E3 keda-no-target (eval design §2): a ScaledObject whose target does not
# exist, beside two lookalikes failing with the same condition reason for
# another cause. Nothing here is ever sent to the model.
name: e3-keda-no-target
anchor: {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: no-target}
subjects:
  - {group: apps, version: v1, resource: deployments, kind: Deployment, namespace: klyx-eval-e3, name: no-such-deployment}
lookalikes:
  - {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: bad-auth}
  - {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: ghost-auth}
  - {group: keda.sh, version: v1alpha1, resource: triggerauthentications, kind: TriggerAuthentication, namespace: klyx-eval-e3, name: missing-secret}
invariants:
  - object: {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: no-target}
    condition: {type: Ready, status: "False", reason: ScaledObjectCheckFailed}
  - object: {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: no-target}
    path: status.conditions[type=Ready].message
    matches: 'deployments\.apps "no-such-deployment" not found'
  - object: {group: apps, version: v1, resource: deployments, kind: Deployment, namespace: klyx-eval-e3, name: no-such-deployment}
    absent: true
  - object: {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: no-target}
    event: {reason: ScaledObjectCheckFailed, message: 'deployments\.apps "no-such-deployment" not found', within: 1h}
  - object: {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: bad-auth}
    condition: {type: Ready, status: "False", reason: ScaledObjectCheckFailed}
  - object: {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: ghost-auth}
    condition: {type: Ready, status: "False", reason: ScaledObjectCheckFailed}
witnesses:
  - object: {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: bad-auth}
    path: metadata.uid
  - object: {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: ghost-auth}
    path: metadata.uid
predicates:
  - id: e3-event
    kind: event
    pattern: 'deployments\.apps "no-such-deployment" not found'
    subjectRef: {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: no-target}
    reads:
      - {tool: get_events, args: {namespace: klyx-eval-e3, name: no-target}}
      - {tool: get_resource, args: {namespace: klyx-eval-e3, name: no-target}}
  - id: e3-condition
    kind: condition
    type: Ready
    status: "False"
    reason: ScaledObjectCheckFailed
    pattern: 'no-such-deployment'
    subjectRef: {group: keda.sh, version: v1alpha1, resource: scaledobjects, kind: ScaledObject, namespace: klyx-eval-e3, name: no-target}
    reads:
      - {tool: get_resource, args: {namespace: klyx-eval-e3, name: no-target}}
proxies:
  cause: 'no-such-deployment|does not exist|not found|missing (target|deployment)'
  lookalike: '\b(auth|secret|token|credential)'
